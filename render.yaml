# Render blueprint for ImpactPay.
#
# Deploys three resources:
#   impactpay-api  — the Go backend (Docker) with PostgreSQL
#   impactpay-web  — the Next.js frontend
#   impactpay-db   — managed PostgreSQL
#
# PayPal stays in sandbox: set PAYPAL_CLIENT_ID / PAYPAL_CLIENT_SECRET /
# PAYPAL_WEBHOOK_ID in the Render dashboard (sync: false keeps them out of Git).
# PAYPAL_BASE_URL must remain a sandbox host or the API refuses to start.

databases:
  - name: impactpay-db
    databaseName: impactpay
    user: impactpay
    plan: basic-256mb
    region: oregon

services:
  - type: web
    name: impactpay-api
    runtime: docker
    plan: starter
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        fromDatabase:
          name: impactpay-db
          property: connectionString
      - key: AUTO_MIGRATE
        value: "true"
      # Set to 1 for a hosted demo instance. It seeds the deterministic dataset
      # on first boot; leave unset for an empty production database.
      - key: DEMO_MODE
        value: "0"
      - key: COOKIE_SECURE
        value: "true"
      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_LOCAL_DIR
        value: /app/data/storage
      - key: PUBLIC_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_CURRENCY
        value: USD
      - key: PAYPAL_FX_RATE_INR_PER_USD
        value: "83.00"
      - key: AI_API_KEY
        sync: false
      # Uncomment to keep evidence in S3-compatible object storage instead of the
      # container filesystem (recommended if you scale beyond one instance).
      # - key: STORAGE_DRIVER
      #   value: s3
      # - key: S3_BUCKET
      #   sync: false
      # - key: S3_REGION
      #   sync: false
      # - key: S3_ACCESS_KEY_ID
      #   sync: false
      # - key: S3_SECRET_ACCESS_KEY
      #   sync: false

  - type: web
    name: impactpay-web
    runtime: node
    plan: starter
    region: oregon
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Baked into the client bundle at build time.
      - key: NEXT_PUBLIC_API_URL
        sync: false
      # Used by server components to read public data.
      - key: API_URL
        sync: false
